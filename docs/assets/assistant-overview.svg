<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">A personal assistant for structured data and Calendar</title>
  <desc id="desc">A query enters the assistant, which uses an LLM, metadata and read-only SQL to analyze observed records. Source adapters return rows and schemas from Google Sheets, Firestore and Calendar. Structured tables can contain people, income, expenses or shopping records. Writes require owner confirmation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#526C8D"/>
    </marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#147D72"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="758" rx="32" fill="#F7FAFD" stroke="#DCE5F0" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" text-anchor="middle" fill="#19334D">
    <text x="380" y="49" font-size="25" font-weight="500" fill="#526C8D">A little help, when you need it</text>

    <!-- Primary flow: Query -> framework -> Output. -->
    <rect x="32" y="158" width="156" height="148" rx="24" fill="#FFFFFF" stroke="#D4DFEC" stroke-width="2"/>
    <text x="110" y="202" font-size="32" font-weight="650">Query</text>
    <path d="M83 225 H137 A10 10 0 0 1 147 235 V256 A10 10 0 0 1 137 266 H104 L89 278 V266 H83 A10 10 0 0 1 73 256 V235 A10 10 0 0 1 83 225Z" fill="#EAF0FC" stroke="#526C8D" stroke-width="2.5"/>
    <path d="M87 240 H132 M87 251 H119" fill="none" stroke="#526C8D" stroke-width="3" stroke-linecap="round"/>

    <path d="M195 232 H234" fill="none" stroke="#526C8D" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="242" y="87" width="276" height="270" rx="30" fill="#E9EDFF" stroke="#B9C4EA" stroke-width="2"/>
    <text x="380" y="128" font-size="34" font-weight="700">Assistant</text>
    <text x="380" y="160" font-size="27" fill="#52618A">LLM + metadata</text>

    <!-- Original, code-native robot illustration. -->
    <path d="M380 195 V181" stroke="#5967A8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="380" cy="178" r="7" fill="#32A99B"/>
    <rect x="313" y="220" width="14" height="29" rx="7" fill="#B5C0EB"/>
    <rect x="433" y="220" width="14" height="29" rx="7" fill="#B5C0EB"/>
    <rect x="325" y="198" width="110" height="77" rx="25" fill="#FFFFFF" stroke="#5967A8" stroke-width="3"/>
    <rect x="337" y="211" width="86" height="48" rx="17" fill="#EEF9F7"/>
    <circle cx="357" cy="231" r="6" fill="#19334D"/>
    <circle cx="403" cy="231" r="6" fill="#19334D"/>
    <path d="M369 246 Q380 255 391 246" fill="none" stroke="#147D72" stroke-width="3" stroke-linecap="round"/>
    <path d="M350 283 Q380 272 410 283 L417 310 Q380 324 343 310Z" fill="#FFFFFF" stroke="#5967A8" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="380" cy="298" r="7" fill="#32A99B"/>
    <text x="380" y="341" font-size="24" font-weight="550" fill="#52618A">Read-only SQL</text>

    <path d="M526 232 H565" fill="none" stroke="#526C8D" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="572" y="158" width="156" height="148" rx="24" fill="#FFFFFF" stroke="#D4DFEC" stroke-width="2"/>
    <text x="650" y="202" font-size="32" font-weight="650">Output</text>
    <rect x="621" y="225" width="58" height="48" rx="13" fill="#E8F7F2"/>
    <path d="M635 248 L645 258 L666 236" fill="none" stroke="#147D72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Reads return results; effects wait for explicit owner confirmation. -->
    <rect x="214" y="387" width="332" height="43" rx="21.5" fill="#FFFFFF" stroke="#D4DFEC" stroke-width="1.5"/>
    <text x="380" y="416" font-size="25" font-weight="600">Confirm before writes</text>
    <path d="M242 305 H195 V489" fill="none" stroke="#526C8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="110" y="411" font-size="25" font-weight="600" fill="#526C8D">Source</text>
    <text x="110" y="441" font-size="25" fill="#526C8D">request</text>
    <path d="M565 489 V305 H526" fill="none" stroke="#147D72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/>
    <text x="650" y="411" font-size="25" font-weight="600" fill="#147D72">Source</text>
    <text x="650" y="441" font-size="25" fill="#147D72">rows</text>

    <!-- Structured records use Sheets/Firestore; Calendar retains event semantics. -->
    <rect x="32" y="501" width="696" height="226" rx="28" fill="#EDF3F8" stroke="#D4DFEC" stroke-width="2"/>
    <text x="380" y="538" font-size="30" font-weight="650">Data sources</text>
    <text x="265" y="572" font-size="24" font-weight="550" fill="#526C8D">Structured tables</text>
    <text x="601" y="572" font-size="24" font-weight="550" fill="#526C8D">Events</text>
    <rect x="55" y="585" width="208" height="103" rx="18" fill="#FFFFFF"/>
    <rect x="276" y="585" width="208" height="103" rx="18" fill="#FFFFFF"/>
    <rect x="497" y="585" width="208" height="103" rx="18" fill="#FFFFFF"/>
    <image x="73" y="612" width="48" height="48" aria-hidden="true" href="data:image/png;base64,"/>
    <text x="185" y="626" font-size="26" font-weight="600">Google</text>
    <text x="185" y="657" font-size="26">Sheets</text>
    <svg x="287" y="610" width="52" height="52" viewBox="0 0 24 24" aria-hidden="true"><defs><style>.firestore-cls-1{fill:#669df6;}.firestore-cls-2{fill:#aecbfa;}.firestore-cls-3{fill:#4285f4;}</style></defs><title>Icon_24px_Firestore_Color</title><g data-name="Product Icons"><g data-name="colored-32/firestore"><g ><path class="firestore-cls-1" d="M21,13,12,9v4l9,4Zm0-7L12,2V6l9,4Z"/><polygon id="firestore-Rectangle-7" class="firestore-cls-2" points="3 6 12 2 12 6 3 10 3 6"/><polygon id="firestore-Rectangle-7-2" data-name="Rectangle-7" class="firestore-cls-2" points="3 13 12 9 12 13 3 17 3 13"/><polygon id="firestore-Rectangle-7-3" data-name="Rectangle-7" class="firestore-cls-3" points="12 18 15.37 16.5 19.88 18.5 12 22 12 18"/></g></g></g></svg>
    <text x="410" y="645" font-size="26" font-weight="600">Firestore</text>
    <image x="510" y="612" width="48" height="48" aria-hidden="true" href="data:image/png;base64,"/>
    <text x="632" y="645" font-size="26" font-weight="600">Calendar</text>
    <text x="380" y="714" font-size="22" fill="#526C8D">People · income · expenses · shopping</text>
  </g>
</svg>
