[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "line-personal-assistant"
version = "0.1.0"
description = "Owner-confirmed Thai LINE expense and Calendar assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "sqlglot==30.24.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
preflight = ["google-auth>=2.38,<3"]
production = ["google-auth>=2.38,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
line_assistant = ["data/*.json"]
