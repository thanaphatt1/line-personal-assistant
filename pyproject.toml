[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "line-personal-assistant"
version = "0.1.0"
description = "Owner-confirmed Thai LINE expense and Calendar assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "sqlglot==30.24.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff==0.17.3", "mypy==2.4.1", "pip-audit==2.10.1"]
preflight = ["google-auth>=2.38,<3"]
production = ["google-auth>=2.38,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
line_assistant = ["data/*.json"]

[tool.ruff]
target-version = "py311"
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Catch syntax/name/control-flow defects without reformatting retained code.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["src/line_assistant/planner_failures.py", "src/line_assistant/sheet_dates.py"]
strict = true
follow_imports = "skip"
warn_unused_configs = true
